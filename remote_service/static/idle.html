<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>TermDeck Remote · Paused</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #090b10; color: #e8edf5; padding: 24px; }
    main { width: min(460px, 100%); padding: 32px; border: 1px solid #293140; border-radius: 16px; background: #11151d; box-shadow: 0 24px 80px #0009; }
    h1 { margin: 0 0 10px; font-size: 25px; }
    p { margin: 0 0 22px; color: #9ca9bb; line-height: 1.5; }
    button { width: 100%; min-height: 44px; border: 1px solid #3b82c4; border-radius: 999px; color: #f5f9ff; background: #1769aa; font: inherit; cursor: pointer; }
    button:hover, button:focus-visible { background: #2279bd; outline: none; }
    .mark { color: #64b5f6; }
  </style>
</head>
<body>
  <main>
    <h1><span class="mark">◉</span> Reconnecting</h1>
    <p>TermDeck released the remote connection while this page was in the background. Your terminals kept
      running on your computer, and this page reconnects on its own.</p>
    <button id="resume" type="button">Reconnect now</button>
  </main>
  <script>
    const remoteIdle = __TERMDECK_REMOTE_IDLE_CONFIG__;
    let resuming = false;
    function resumeTermDeck() {
      if (resuming) return;
      resuming = true;
      location.replace(remoteIdle.returnTo);
    }
    // The deck only parks here while its page is hidden, so an idle page that is on screen means
    // someone has come back to it: reconnect without waiting to be tapped. A phone returning through
    // the app switcher or the back gesture restores this page from the back/forward cache with no
    // visibility change, which is why pageshow and focus carry it too, and why the first check runs
    // on load. The button stays for the case where none of that fires.
    function resumeWhenVisible() {
      if (!document.hidden) resumeTermDeck();
    }
    document.getElementById("resume").addEventListener("click", resumeTermDeck);
    window.addEventListener("keydown", resumeTermDeck, { capture: true });
    window.addEventListener("pointerdown", resumeTermDeck, { capture: true });
    window.addEventListener("touchstart", resumeTermDeck, { capture: true, passive: true });
    window.addEventListener("wheel", resumeTermDeck, { capture: true, passive: true });
    document.addEventListener("visibilitychange", resumeWhenVisible);
    window.addEventListener("pageshow", resumeWhenVisible);
    window.addEventListener("focus", resumeWhenVisible);
    resumeWhenVisible();
  </script>
</body>
</html>

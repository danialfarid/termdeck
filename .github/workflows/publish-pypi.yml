name: Publish PyPI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to publish
        required: true
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Download the tested release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern "termdeck_agents-${RELEASE_TAG#v}*"
          test -f "dist/termdeck_agents-${RELEASE_TAG#v}-py3-none-any.whl"
          test -f "dist/termdeck_agents-${RELEASE_TAG#v}.tar.gz"
          python -m pip install twine
          python -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
